<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Subscription App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Inti Ruchi - Food Subscriptions</h1>

      <section>
        <h2>Food Varieties</h2>
        <div id="food-list" class="grid"></div>
      </section>

      <section>
        <h2>Subscription Types</h2>
        <div id="subscription-list" class="grid"></div>
      </section>

      <section>
        <h2>Cart</h2>
        <ul id="cart-items"></ul>
        <p id="cart-total">Total: ₹0</p>
        <button id="place-order-btn">Place Order</button>
        <p id="order-status" aria-live="polite"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
